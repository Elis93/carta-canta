<h2 class="sr-only">Impostazioni - Fiscale: regime, P.IVA, codice fiscale, bollo e ritenuta automatici.</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 14px;"><div style="background: var(--color-background-primary); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(20,20,40,.05), 0 16px 38px -16px rgba(20,20,40,.20);">

  <div style="display:flex; align-items:center; gap:10px; padding: 15px 16px;">

  </div>

  <div style="margin: 6px 16px 0; display:flex; justify-content:space-between; align-items:center; border-bottom:0.5px solid var(--color-border-tertiary);">

  <div style="padding: 18px 16px 16px;">
    <div style="background:#fff; border-radius:13px; box-shadow:0 1px 2px rgba(20,20,40,.04), 0 6px 16px -8px rgba(20,20,40,.13); padding: 14px 15px; margin-bottom:14px;">
      <div style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color: var(--color-text-tertiary); font-weight:500; margin-bottom:12px;">Dati fiscali</div>

        <div style="flex:1;"><label style="font-size:13px; color: var(--color-text-secondary);">Codice Fiscale</label><div style="margin-top:5px; border:0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding:10px 11px; font-size:14px; color: var(--color-text-tertiary);">-</div></div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:0.5px solid var(--color-border-tertiary);">
