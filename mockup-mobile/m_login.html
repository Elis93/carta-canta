<h2 class="sr-only">Mockup mobile schermata di accesso: logo, accesso con Google, email e password, link alla registrazione.</h2>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 14px;">
  <div style="background: var(--color-background-primary); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(20,20,40,.05), 0 16px 38px -16px rgba(20,20,40,.20); padding: 30px 20px 24px;">

    <div style="text-align:center; margin-bottom:26px;">
      <svg viewBox="0 80 760 300" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto; width:100%; max-width:340px; height:auto;" role="img" aria-label="Carta Canta - il tuo ufficio in tasca">
        <g transform="translate(305,78) scale(0.293)">
          <rect width="512" height="512" rx="112" fill="#1a1a2e"/>
          <path d="M342 133 A150 150 0 1 0 342 379" fill="none" stroke="#c9a44c" stroke-width="38" stroke-linecap="round"/>
          <path d="M307 175 A96 96 0 1 0 307 337" fill="none" stroke="#f3ede0" stroke-width="30" stroke-linecap="round"/>
        </g>
        <text x="380" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#1a1a2e">Carta <tspan fill="#c9a44c">Canta</tspan></text>
        <rect x="310" y="324" width="140" height="1.4" fill="#dcd3bf"/>
        <text x="380" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#b08d3e">il tuo ufficio in tasca</text>
      </svg>
      <div style="font-size:20px; font-weight:600; margin-top:16px;">Bentornato</div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:9px; border:0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 12px; margin-bottom:16px;">
      <i class="ti ti-brand-google" style="font-size:18px; color:#1a1a2e;" aria-hidden="true"></i><span style="font-size:14px; font-weight:500;">Continua con Google</span>
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <div style="flex:1; height:0.5px; background: var(--color-border-secondary);"></div>
      <span style="font-size:13px; color: var(--color-text-tertiary);">oppure</span>
      <div style="flex:1; height:0.5px; background: var(--color-border-secondary);"></div>
    </div>

    <label style="font-size:13px; color: var(--color-text-secondary);">Email</label>
    <div style="margin-top:5px; margin-bottom:12px; border:0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding:11px; font-size:14px; color: var(--color-text-tertiary);">tu@email.it</div>

    <label style="font-size:13px; color: var(--color-text-secondary);">Password</label>
    <div style="margin-top:5px; display:flex; align-items:center; justify-content:space-between; border:0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding:11px; font-size:14px;">
      <span style="letter-spacing:2px;">********</span><i class="ti ti-eye" style="font-size:17px; color: var(--color-text-tertiary);" aria-hidden="true"></i>
    </div>
    <div style="text-align:right; margin-top:7px;"><span style="font-size:13px; color: var(--color-text-info);">Password dimenticata?</span></div>

    <div style="margin-top:16px; display:flex; align-items:center; justify-content:center; background:#1a1a2e; border-radius: var(--border-radius-md); padding: 13px;">
      <span style="font-size:14px; font-weight:500; color:#fff;">Accedi</span>
    </div>

    <div style="text-align:center; margin-top:16px; font-size:13px; color: var(--color-text-secondary);">Non hai un account? <span style="font-weight:500; color: var(--color-text-primary);">Registrati</span></div>

  </div>
</div>
