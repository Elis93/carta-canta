<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sei offline — Carta Canta</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa; color: #1a1a2e;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .box { max-width: 340px; }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: .02em; margin-bottom: 14px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #55534b; line-height: 1.5; margin: 0 0 18px; }
    button {
      border: none; background: #1a1a2e; color: #fff; font-size: 14px; font-weight: 600;
      border-radius: 12px; padding: 12px 22px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Carta Canta</div>
    <h1>Sei offline</h1>
    <p>Controlla la connessione a internet. I tuoi dati sono al sicuro: riprova appena torni online.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
